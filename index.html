function socById(id){
 var found=null;
 (DATA.soc||[]).forEach(function(c){if(c.id===id)found=c;});
 return found;
}
function socState(id){
 if(!S.soc[id])S.soc[id]={disposition:"",justification:"",who:"",what:"",when:"",where:"",why:"",host:"",user:"",verdict:"",action:"",iocs:{},inds:{},logQ:"",hintUsed:false,showHint:false,result:null};
 return S.soc[id];
}
function normSoc(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim();}
function hasTerm(text, term){
 var from=0;
 while(from<text.length){
  var i=text.indexOf(term, from);
  if(i<0)return false;
  var lead=text.slice(Math.max(0,i-4), i);
  var neg=lead.slice(-2)==="un" || lead.slice(-4)==="not " || lead.slice(-3)==="non";
  if(!neg)return true;
  from=i+term.length;
 }
 return false;
}
function textMiss(val, rule){
 if(!rule)return "";
 var text=normSoc(val);
 if(rule.minlen && text.length<rule.minlen)return rule.note;
 var groups=rule.groups||[];
 for(var g=0;g<groups.length;g++){
  var ok=false;
  for(var i=0;i<groups[g].length;i++){if(hasTerm(text, groups[g][i])){ok=true;break;}}
  if(!ok)return rule.note;
 }
 return "";
}
function setProblems(list, picked){
 var missed=[], extra=[];
 (list||[]).forEach(function(i){
  var on=!!(picked&&picked[i.id]);
  if(i.good&&!on)missed.push(i.short);
  if(!i.good&&on)extra.push(i.short);
 });
 if(!missed.length&&!extra.length)return "";
 var msg="";
 if(missed.length)msg+="Missing: "+missed.join(", ")+". ";
 if(extra.length)msg+="Should not be listed: "+extra.join(", ")+".";
 return msg.trim();
}
function gradeSoc(c, st){
 var items=[];
 function add(label, pass, note){items.push({label:label,pass:!!pass,note:note||""});}
 add("Disposition", st.disposition===c.disposition, c.dispositionNote);
 add("Justification", textMiss(st.justification, c.justify)==="", c.justify.note);
 add("Who", textMiss(st.who, c.who)==="", c.who.note);
 add("What", textMiss(st.what, c.what)==="", c.what.note);
 add("When", textMiss(st.when, c.when)==="", c.when.note);
 add("Where", textMiss(st.where, c.where)==="", c.where.note);
 add("Why", textMiss(st.why, c.why)==="", c.why.note);
 add("Affected host", textMiss(st.host, c.host)==="", c.host.note);
 add("Affected user", textMiss(st.user, c.user)==="", c.user.note);
 var iocDetail=setProblems(c.iocs, st.iocs);
 add("IOCs", iocDetail==="", c.iocNote+(iocDetail?(" "+iocDetail):""));
 if(c.indicators){
  var indDetail=setProblems(c.indicators, st.inds);
  add("Email indicators", indDetail==="", (c.indicatorNote||"")+(indDetail?(" "+indDetail):""));
 }
 add("Verdict", st.verdict===c.disposition, c.verdictNote);
 add("Recommended action", st.action===c.action, c.actionNote);
 var score=0;
 items.forEach(function(it){if(it.pass)score++;});
 return {ok:score===items.length,score:score,total:items.length,items:items};
}
function readSocForm(c){
 var st=socState(c.id);
 var root=document.getElementById("soc-case");
 if(!root)return st;
 ["justification","who","what","when","where","why","host","user","verdict"].forEach(function(k){
  var el=root.querySelector("[data-soc-field='"+k+"']");
  if(el)st[k]=el.value;
 });
 var d=root.querySelector("input[name='soc-disposition']:checked");
 st.disposition=d?d.value:"";
 var act=root.querySelector("input[name='soc-action']:checked");
 st.action=act?act.value:"";
 st.iocs={};
 c.iocs.forEach(function(i){
  var el=root.querySelector("[data-soc-ioc='"+i.id+"']");
  st.iocs[i.id]=!!(el&&el.checked);
 });
 st.inds={};
 (c.indicators||[]).forEach(function(i){
  var el=root.querySelector("[data-soc-ind='"+i.id+"']");
  st.inds[i.id]=!!(el&&el.checked);
 });
 var q=root.querySelector("[data-soc-log]");
 if(q)st.logQ=q.value;
 return st;
}
function socSubmit(){
 var c=socById(S.socCase);
 if(!c)return;
 var st=readSocForm(c);
 var graded=gradeSoc(c, st);
 st.result=graded;
 if(graded.ok&&S.completed.indexOf(c.id)===-1){
  S.completed.push(c.id);
  award(Math.round(c.reward*hm()),"SOC case closed - "+c.title,"blue");
  var msg="Case closed: "+c.title+".";
  if(c.badge)msg+=" Badge: "+c.badge+".";
  var n=0;
  DATA.soc.forEach(function(x){if(S.completed.indexOf(x.id)>-1)n++;});
  if(n===1)msg+=" Badge: Queue Clear.";
  if(n===DATA.soc.length)msg+=" Badge: Shift Lead.";
  S.levelUp=msg;
  save();
 }
 render();
}
function socHint(){
 var c=socById(S.socCase);
 if(!c)return;
 var st=readSocForm(c);
 st.showHint=true;
 if(!st.hintUsed){
  st.hintUsed=true;
  award(-hintCost(),"Hint used - "+c.title,"");
 }
 render();
}
function sevVar(s){return s==="critical"?"--dng":s==="high"?"--wrn":s==="medium"?"--acc":"--suc";}
function sevSub(s){return s==="critical"?"--dngsub":s==="high"?"--wrnsub":s==="medium"?"--accsub":"--sucsub";}
function socStatus(c){
 if(S.completed.indexOf(c.id)>-1)return "Closed";
 var st=S.soc[c.id];
 if(st&&(st.result||st.disposition||st.justification||st.who))return "In progress";
 return "New";
}
function socLogsHtml(c, q){
 var query=normSoc(q);
 var lines=[];
 c.logs.forEach(function(line){if(!query||normSoc(line).indexOf(query)!==-1)lines.push(line);});
 var meta='<p class="muted" id="soc-log-meta">Showing '+lines.length+" of "+c.logs.length+"</p>";
 if(!lines.length)return meta+'<p class="sec">No log lines match that filter.</p>';
 return meta+'<table class="siem"><tbody>'+lines.map(function(line){return '<tr><td class="ev">'+esc(line)+'</td></tr>';}).join("")+"</tbody></table>";
}
function paintSocLogs(){
 var c=socById(S.socCase);
 var box=document.getElementById("soc-logs");
 if(!c||!box)return;
 box.innerHTML=socLogsHtml(c, socState(c.id).logQ);
}
function socField(name, label, value, placeholder){
 return '<label class="fld">'+esc(label)+'<input class="wide" type="text" data-soc-field="'+name+'" value="'+esc(value||"")+'" placeholder="'+esc(placeholder||"")+'" autocomplete="off"></label>';
}
function socArea(name, label, value, placeholder){
 return '<label class="fld">'+esc(label)+'<textarea data-soc-field="'+name+'" placeholder="'+esc(placeholder||"")+'" autocomplete="off">'+esc(value||"")+'</textarea></label>';
}
function socChecks(list, attr, picked){
 return (list||[]).map(function(i){
  var on=!!(picked&&picked[i.id]);
  return '<label class="chk"><input type="checkbox" data-'+attr+'="'+i.id+'"'+(on?" checked":"")+'> <span>'+esc(i.label)+'</span></label>';
 }).join("");
}
function socEmailHtml(e){
 if(!e)return "";
 var h='<div class="card"><h3>Reported message</h3><div class="subcard email" style="margin-top:10px"><pre>'+esc(e.raw)+'</pre>';
 if(e.links&&e.links.length){
  h+='<p class="muted" style="margin-top:8px">Links</p>';
  e.links.forEach(function(link){h+='<p style="font-family:var(--mono);font-size:12px;word-break:break-all">'+esc(link)+'</p>';});
 }
 if(e.attachment){
  h+='<p style="margin-top:8px"><span class="muted">Attachment</span> '+esc(e.attachment.name)+'</p>';
  h+='<p style="font-family:var(--mono);font-size:12px;word-break:break-all">SHA256 '+esc(e.attachment.sha256)+'</p>';
 }else h+='<p class="muted" style="margin-top:8px">No attachment.</p>';
 h+='</div></div>';
 return h;
}
function socResultHtml(c, st){
 var g=st.result;
 if(!g)return "";
 var gain=Math.round(c.reward*hm());
 var head=g.ok?("All "+g.total+" checks passed. "+c.debrief+" Blue XP for this case: +"+gain+" (awarded once)."):(g.score+" of "+g.total+" checks passed. Fix the misses and submit again. Blue XP is awarded only when every check passes.");
 var list=g.items.map(function(it){
  return '<div class="subcard"><div class="row">'+chip(it.pass?"Pass":"Miss",it.pass?"--suc":"--dng",it.pass?"--sucsub":"--dngsub")+'<strong>'+esc(it.label)+'</strong></div>'+(it.note&&!it.pass?'<p class="sec" style="margin-top:6px">'+esc(it.note)+'</p>':"")+'</div>';
 }).join("");
 return '<div class="card" id="soc-result">'+fb(head,g.ok?"ok":"err")+'<div class="col" style="gap:8px;margin-top:12px">'+list+'</div></div>';
}
function viewSocQueue(){
 var done=0;
 DATA.soc.forEach(function(c){if(S.completed.indexOf(c.id)>-1)done++;});
 var html='<div class="card"><h2>SOC Analyst</h2><p class="sec" style="margin-top:8px">A simulated L1 shift. Alerts, logs, and messages are fictional, and this page does not call a SIEM or the network. Triage each alert, search that case\'s logs, and file the L1 report. A fully correct report awards blue XP once. Hard mode multiplies that reward. Closed case ids are stored with your other completed work, so Export/Import keeps them.</p>';
 html+='<div class="col" style="gap:8px;margin-top:12px">';
 html+='<div class="subcard"><strong>False positive.</strong> <span class="sec">The activity is authorized or benign. Close it.</span></div>';
 html+='<div class="subcard"><strong>True positive.</strong> <span class="sec">It is malicious or against policy, and the case runbook tells L1 to contain it.</span></div>';
 html+='<div class="subcard"><strong>Escalate.</strong> <span class="sec">A true incident the runbook sends to IR, malware, or identity.</span></div>';
 html+='</div><p class="muted" style="margin-top:10px">Closed '+done+" of "+DATA.soc.length+".</p></div>";
 html+='<div class="card" style="overflow-x:auto"><table class="siem"><thead><tr><th>Severity</th><th>Time (UTC)</th><th>Source</th><th>Rule</th><th>Status</th><th></th></tr></thead><tbody>';
 html+=DATA.soc.map(function(c){
  var status=socStatus(c);
  var tone=status==="Closed"?"--suc":status==="In progress"?"--acc":"--tx3";
  return "<tr><td>"+chip(c.severity,sevVar(c.severity),sevSub(c.severity))+"</td><td class=\"mono\">"+esc(c.time)+"</td><td>"+esc(c.source)+"</td><td>"+esc(c.rule)+"<div class=\"muted\">"+esc(c.entity)+"</div></td><td>"+chip(status,tone,"--sub")+"</td><td><button class=\"btn\" data-action=\"soc-open\" data-case=\""+c.id+"\">Open</button></td></tr>";
 }).join("");
 html+="</tbody></table></div>";
 return html;
}
function viewSocCase(c){
 var st=socState(c.id);
 var closed=S.completed.indexOf(c.id)>-1;
 var gain=Math.round(c.reward*hm());
 var dispositions=[{id:"false-positive",label:"False positive"},{id:"true-positive",label:"True positive"},{id:"escalate",label:"Escalate"}];
 var html='<div id="soc-case"><div class="row" style="margin-bottom:4px"><button class="btn" data-action="soc-back">Back to queue</button>'+chip(c.severity,sevVar(c.severity),sevSub(c.severity))+chip(c.diff,diffVar(c.diff),"--sub")+chip("+"+gain+" blue XP","--acc","--accsub")+(closed?chip("Closed","--suc","--sucsub"):"")+"</div>";
 html+='<div class="card"><h2>'+esc(c.title)+'</h2>';
 html+='<p class="sec" style="margin-top:8px">ATT&CK <a href="'+esc(attackUrl(c.techid))+'" target="_blank" rel="noopener noreferrer">'+esc(c.techid)+" "+esc(c.tech)+"</a></p>";
 html+='<div class="grid2" style="margin-top:12px"><div class="subcard"><p class="muted">Time (UTC)</p><p>'+esc(c.time)+'</p></div><div class="subcard"><p class="muted">Source</p><p>'+esc(c.source)+'</p></div><div class="subcard"><p class="muted">Rule</p><p>'+esc(c.rule)+'</p></div><div class="subcard"><p class="muted">Entity</p><p>'+esc(c.entity)+'</p></div></div>';
 html+='<p class="sec" style="margin-top:12px">'+esc(c.brief)+"</p></div>";
 html+='<div class="card"><h3>L1 runbook excerpt</h3><p class="sec" style="margin-top:8px">'+esc(c.runbook)+"</p></div>";
 if(closed)html+='<div class="card" style="background:var(--sucsub);border-color:var(--suc)"><h3 style="color:var(--suc)">Case closed</h3><p class="sec" style="margin-top:8px">Blue XP was already awarded for this case. The logs stay available for review.</p></div>';
 html+=socEmailHtml(c.email);
 html+='<div class="card"><h3>Logs</h3><p class="muted" style="margin-top:6px">Substring filter. Try an event id, host, user, or IP.</p><input class="wide" type="text" data-soc-log="1" value="'+esc(st.logQ||"")+'" placeholder="Filter logs" autocomplete="off" style="margin-top:8px"><div id="soc-logs" style="margin-top:10px">'+socLogsHtml(c, st.logQ)+"</div></div>";
 html+='<div class="card"><h3>Triage</h3><p class="sec" style="margin-top:8px">Choose the queue decision, then justify it with evidence from the logs.</p><div style="margin-top:8px">';
 html+=dispositions.map(function(o){
  return '<label class="chk"><input type="radio" name="soc-disposition" value="'+o.id+'"'+(st.disposition===o.id?" checked":"")+'> <span>'+esc(o.label)+"</span></label>";
 }).join("");
 html+="</div>"+socArea("justification","Justification",st.justification,"One or two sentences citing the host, account, ticket, or log event.")+"</div>";
 html+='<div class="card"><h3>L1 case report</h3><p class="sec" style="margin-top:8px">The five Ws, the affected host and user, the indicators, a verdict, and the action the runbook asks for. All checks must pass.</p>';
 html+='<div class="formgrid" style="margin-top:12px">'+socField("who","Who",st.who,"Account, sender, or source")+'</div>';
 html+='<div class="formgrid">'+socField("what","What",st.what,"What happened")+socField("when","When",st.when,"Time from the alert or logs")+socField("where","Where",st.where,"Host or service")+socField("why","Why",st.why,"Why it is or is not malicious")+"</div>";
 html+='<div class="formgrid">'+socField("host","Affected host",st.host,"Hostname")+socField("user","Affected user",st.user,"Account")+"</div>";
 html+='<p class="muted" style="margin-top:12px">IOCs to record</p>'+socChecks(c.iocs,"soc-ioc",st.iocs);
 if(c.indicators){
  html+='<p class="muted" style="margin-top:12px">'+esc(c.indicatorPrompt||"Email indicators")+"</p>"+socChecks(c.indicators,"soc-ind",st.inds);
 }
 html+='<div class="formgrid" style="margin-top:12px"><label class="fld">Verdict<select data-soc-field="verdict">';
 html+='<option value=""'+(st.verdict===""?" selected":"")+'>Select a verdict</option>';
 html+=dispositions.map(function(o){return '<option value="'+o.id+'"'+(st.verdict===o.id?" selected":"")+'>'+esc(o.label)+"</option>";}).join("");
 html+="</select></label></div>";
 html+='<p class="muted" style="margin-top:12px">Recommended action</p>';
 html+=(c.actions||[]).map(function(o){
  return '<label class="chk"><input type="radio" name="soc-action" value="'+o.id+'"'+(st.action===o.id?" checked":"")+'> <span>'+esc(o.label)+"</span></label>";
 }).join("");
 html+='<div class="row" style="margin-top:12px"><button class="btn primary" data-action="soc-submit">Submit case report</button><button class="btn" data-action="soc-hint">Hint (-'+hintCost()+' XP)</button></div>';
 if(st.showHint)html+='<div style="margin-top:12px">'+fb("Hint: "+c.hint,"")+"</div>";
 html+="</div>";
 html+=socResultHtml(c, st);
 html+="</div>";
 return html;
}
function viewSoc(){
 if(S.socCase){
  var c=socById(S.socCase);
  if(c)return viewSocCase(c);
  S.socCase=null;
 }
 return viewSocQueue();
}

/* ---------- render + events ---------- */
function render(){
 document.documentElement.setAttribute("data-theme",S.theme);
 renderNav();
 var st=document.getElementById("subtitle");if(st)st.textContent="A gamified, fully simulated cyber range for "+(S.name||"operators")+". Progress saves to this browser.";
 renderLevelUp();
 var c=document.getElementById("content");
 if(S.tab==="home")c.innerHTML=viewHome();
 else if(S.tab==="ladder")c.innerHTML=viewLeaderboard();
 else if(S.tab==="daily")c.innerHTML=viewDaily();
 else if(S.tab==="attack")c.innerHTML=viewAttack();
 else if(S.tab==="quiz")c.innerHTML=viewQuiz();
 else if(S.tab==="red")c.innerHTML=viewSide("red");
 else if(S.tab==="blue")c.innerHTML=viewSide("blue");
 else if(S.tab==="soc")c.innerHTML=viewSoc();
 else if(S.tab==="scenario")c.innerHTML=viewScenario();
 else if(S.tab==="campaigns")c.innerHTML=viewCampaigns();
}

document.addEventListener("click",function(e){
 var t=e.target;while(t&&t!==document&&!t.getAttribute("data-action"))t=t.parentNode;
 if(!t||t===document)return;
 var a=t.getAttribute("data-action");
 if(a==="tab"){S.tab=t.getAttribute("data-tab");S.selectedLab=null;S.selectedCampaign=null;S.notice=null;render();}
 else if(a==="theme"){S.theme=S.theme==="dark"?"light":"dark";save();render();}
 else if(a==="dismiss"){S.levelUp="";render();}
 else if(a==="toggle-hard"){S.hardMode=!S.hardMode;save();render();}
 else if(a==="toggle-thm"){S.thmMode=!S.thmMode;save();render();}
 else if(a==="export-progress"){exportProgress();}
 else if(a==="pick-import"){var inp=document.getElementById("import-file");if(inp)inp.click();}
 else if(a==="reset"){S.notice=null;resetAll();}
 else if(a==="set-diff"){S.diffFilter=t.getAttribute("data-diff");render();}
 else if(a==="open-lab"){S.selectedLab=t.getAttribute("data-lab");render();}
 else if(a==="open-attack-lab"){var aid=t.getAttribute("data-lab");var alab=LAB_INDEX[aid];if(alab){S.tab=alab.side;S.selectedLab=aid;S.selectedCampaign=null;}render();}
 else if(a==="back-labs"){S.selectedLab=null;render();}
 else if(a==="open-campaign"){S.selectedCampaign=t.getAttribute("data-camp");render();}
 else if(a==="back-campaigns"){S.selectedCampaign=null;render();}
 else if(a==="lab-run"){submitTerminal(LAB_INDEX[t.getAttribute("data-lab")]);}
 else if(a==="lab-choice"){submitChoice(LAB_INDEX[t.getAttribute("data-lab")],parseInt(t.getAttribute("data-idx"),10));}
 else if(a==="lab-hint"){useHint(LAB_INDEX[t.getAttribute("data-lab")]);}
 else if(a==="quiz-pick"){var pos=parseInt(t.getAttribute("data-pos"),10);if(S.quizPicks[pos]===null||S.quizPicks[pos]===undefined){S.quizPicks[pos]=parseInt(t.getAttribute("data-opt"),10);render();}}
 else if(a==="quiz-next"){S.quizIdx=Math.min(14,S.quizIdx+1);render();}
 else if(a==="quiz-prev"){S.quizIdx=Math.max(0,S.quizIdx-1);render();}
 else if(a==="quiz-finish"){finishQuiz();}
 else if(a==="quiz-retake"){startQuiz();render();}
 else if(a==="daily-pick"){ensureDaily();if(S.dailyLast===S.dailyKey)return;var dpos=parseInt(t.getAttribute("data-pos"),10);S.dailyPicks[dpos]=parseInt(t.getAttribute("data-opt"),10);render();}
 else if(a==="daily-submit"){submitDaily();}
 else if(a==="scn-gen"){generateScenario();}
 else if(a==="scn-pick"){answerScn(parseInt(t.getAttribute("data-qi"),10),parseInt(t.getAttribute("data-oi"),10));}
 else if(a==="soc-open"){S.socCase=t.getAttribute("data-case");render();}
 else if(a==="soc-back"){S.socCase=null;render();}
 else if(a==="soc-submit"){socSubmit();}
 else if(a==="soc-hint"){socHint();}
});
document.addEventListener("change",function(e){
 var t=e.target;if(!t||!t.getAttribute||t.getAttribute("data-import")!=="1")return;
 var file=t.files&&t.files[0];
 t.value="";
 if(file)readImportFile(file);
});
document.addEventListener("input",function(e){
 var t=e.target;if(!t)return;
 if(t.getAttribute&&t.getAttribute("data-action")==="name"){S.name=t.value;save();var st=document.getElementById("subtitle");if(st)st.textContent="A gamified, fully simulated cyber range for "+(S.name||"operators")+". Progress saves to this browser.";}
 else if(t.getAttribute&&t.getAttribute("data-term")){S.inputs[t.getAttribute("data-term")]=t.value;}
 else if(t.getAttribute&&t.getAttribute("data-soc-log")==="1"){if(S.socCase){socState(S.socCase).logQ=t.value;paintSocLogs();}}
});
document.addEventListener("keydown",function(e){
 var t=e.target;if(t&&t.getAttribute&&t.getAttribute("data-term")&&e.key==="Enter"){e.preventDefault();submitTerminal(LAB_INDEX[t.getAttribute("data-term")]);}
});

load();
render();
